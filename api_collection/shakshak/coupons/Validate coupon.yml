info:
  name: Validate Coupon Code
  type: http
  seq: 2

http:
  method: POST
  url: "{{url}}/coupons/validate"
  auth:
    type: bearer
    token: "{{tokenUser}}"
  body:
    type: json
    content: |-
      {
        "code": "RRR",
        "service_id": 1,
        "order_amount": 150.00
      }

headers:
  - name: Content-Type
    value: application/json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
